<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太陽系シミュレーター</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; }
  #ui {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    color: #eee; background: rgba(10,12,24,0.65); padding: 12px 14px;
    border-radius: 10px; backdrop-filter: blur(4px); user-select: none;
    font-size: 13px; line-height: 1.7; min-width: 240px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  #date { font-size: 18px; font-weight: bold; color: #9fd; letter-spacing: 0.5px; }
  #ui label { display: block; margin-top: 6px; }
  #ui input[type=range] { width: 100%; }
  .row { display:flex; justify-content: space-between; align-items:center; gap:8px; }
  .small { color:#9ab; font-size: 11px; }
  button {
    background:#26304d; color:#cde; border:1px solid #3a4a72; border-radius:6px;
    padding:4px 10px; cursor:pointer; font-size:12px;
  }
  button:hover { background:#33406a; }
  #legend { margin-top:8px; font-size:11px; color:#bcd; }
  #legend span { display:inline-block; margin-right:8px; white-space:nowrap; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:middle; margin-right:3px; }
  #hint { position:absolute; bottom:10px; left:10px; color:#778; font-size:11px; z-index:10; }
</style>
</head>
<body>
<div id="ui">
  <div id="date">----</div>
  <div class="small" id="elapsed"></div>
  <label>シミュレーション速度
    <div class="row"><span class="small" id="speedVal"></span></div>
    <input type="range" id="speed" min="-2" max="3" step="0.01" value="0">
  </label>
  <div class="small">スライダー: 1秒あたりの経過年数（対数）</div>
  <div class="row" style="margin-top:8px;">
    <button id="pause">⏸ 一時停止</button>
    <button id="reset">↺ リセット</button>
  </div>
  <label class="row" style="margin-top:8px;">
    <span>重力伝播遅延（光速）</span>
    <input type="checkbox" id="delay" checked>
  </label>
  <label class="row">
    <span>軌道トレイル表示</span>
    <input type="checkbox" id="trails" checked>
  </label>
  <div id="legend"></div>
</div>
<div id="hint">マウス: 左ドラッグ=回転 / 右ドラッグ=移動 / ホイール=拡大縮小</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// 物理定数
// ============================================================
const G = 6.674e-11;            // 万有引力定数 [m^3 kg^-1 s^-2]
const AU = 1.495978707e11;      // 天文単位 [m]
const DAY = 86400;              // 1日 [s]
const YEAR = 365.25 * DAY;      // 1年 [s]
const C = 299792458;            // 光速 [m/s]

// ============================================================
// 天体データ
//  pos: J2000元期 (2000-01-01 12:00 TT) のヘリオセントリック位置 [AU]
//  vel: 同 速度 [AU/day]  (NASA HORIZONS 由来の近似値)
//  mass: 質量 [kg]
//  radius: 表示用の見やすさ優先半径（実スケールではない）
//  color: 基本色
// ============================================================
const BODIES = [
  { name:'太陽',     mass:1.98892e30, radius:14, color:0xffcc33, emissive:true,
    pos:[ 0, 0, 0], vel:[0,0,0] },
  { name:'水星',     mass:3.3011e23,  radius:2.2, color:0xa9a9a9,
    pos:[-1.478672e-1,-4.466929e-1,-2.313937e-2], vel:[ 2.117424e-2,-7.105386e-3,-2.522041e-3] },
  { name:'金星',     mass:4.8675e24,  radius:3.6, color:0xe8c87a,
    pos:[-7.257694e-1,-2.529037e-2, 4.137322e-2], vel:[ 5.189070e-4,-2.031355e-2,-3.072687e-4] },
  { name:'地球',     mass:5.97237e24, radius:3.8, color:0x2a6dd6,
    pos:[-1.756637e-1, 9.659912e-1,-1.020845e-5], vel:[-1.722857e-2,-3.150626e-3, 5.692585e-7] },
  { name:'火星',     mass:6.4171e23,  radius:2.8, color:0xc1440e,
    pos:[ 1.383221e0,-2.380217e-2,-3.441211e-2], vel:[ 7.533013e-4, 1.517888e-2, 3.001893e-4] },
  { name:'木星',     mass:1.8982e27,  radius:9,  color:0xd2a679, bands:true,
    pos:[ 3.996321e0, 2.932561e0,-1.016168e-1], vel:[-4.558298e-3, 6.439756e-3, 7.531843e-5] },
  { name:'土星',     mass:5.6834e26,  radius:8,  color:0xe3d9a6, rings:true,
    pos:[ 6.401527e0, 6.565147e0,-3.689043e-1], vel:[-4.285060e-3, 3.884301e-3, 1.025155e-4] },
  { name:'天王星',   mass:8.6810e25,  radius:5.5, color:0x9fdce3,
    pos:[ 1.442374e1,-1.373533e1,-2.379145e-1], vel:[ 2.683840e-3, 2.665087e-3,-2.484929e-5] },
  { name:'海王星',   mass:1.02413e26, radius:5.3, color:0x3f66c9,
    pos:[ 1.680361e1,-2.499544e1, 1.274276e-1], vel:[ 2.584641e-3, 1.768820e-3,-9.629453e-5] },
];

// 位置・速度を SI 単位 (m, m/s) に変換した状態ベクトル
const state = BODIES.map(b => ({
  name: b.name,
  mass: b.mass,
  p: new THREE.Vector3(b.pos[0]*AU, b.pos[1]*AU, b.pos[2]*AU),
  v: new THREE.Vector3(b.vel[0]*AU/DAY, b.vel[1]*AU/DAY, b.vel[2]*AU/DAY),
  a: new THREE.Vector3(),
  // 重力伝播遅延用の位置履歴 (リングバッファ)
  history: [],
}));

// 系全体の運動量がゼロになるよう太陽の速度を補正（重心を静止させる）
(function balanceMomentum(){
  const totalP = new THREE.Vector3();
  let totalM = 0;
  for(const s of state){ totalP.addScaledVector(s.v, s.mass); totalM += s.mass; }
  // 太陽(index0)で相殺
  state[0].v.addScaledVector(totalP, -1/state[0].mass);
})();

// ============================================================
// シミュレーション設定
// ============================================================
const EPOCH = new Date(Date.UTC(2000,0,1,12,0,0)); // J2000
let simSeconds = 0;          // 経過シミュレーション秒
let running = true;
let yearsPerSecond = 1.0;    // 実時間1秒あたりのシミュレーション年数
let useDelay = true;         // 重力伝播遅延
let showTrails = true;

// 物理積分の固定ステップ（シミュレーション秒）。1ステップ = 0.5日
const PHYS_DT = 0.5 * DAY;
// 履歴保持: 海王星まで光が届くのに最大 ~4時間 程度だが、
// 余裕をもって最大遅延を保持。AUあたりの光遅延 ~499s。
const MAX_DELAY_S = 6 * 3600; // 6時間ぶんの履歴で十分カバー
const HISTORY_STEP = PHYS_DT; // 履歴の時間刻み
const HISTORY_LEN = Math.ceil(MAX_DELAY_S / HISTORY_STEP) + 2;

function pushHistory(){
  for(const s of state){
    s.history.push(s.p.clone());
    if(s.history.length > HISTORY_LEN) s.history.shift();
  }
}

// 遅延を考慮した、時刻 (現在 - delaySeconds) における天体位置を補間取得
function delayedPos(s, delaySeconds){
  const steps = delaySeconds / HISTORY_STEP;     // 何ステップ前か
  const idxFromEnd = steps;
  const n = s.history.length;
  if(n === 0) return s.p;
  const fidx = (n - 1) - idxFromEnd;             // 履歴配列上の実数インデックス
  if(fidx <= 0) return s.history[0];
  if(fidx >= n-1) return s.history[n-1];
  const i = Math.floor(fidx);
  const t = fidx - i;
  return s.history[i].clone().lerp(s.history[i+1], t);
}

// 加速度計算（重力伝播遅延オプション付き）
const tmp = new THREE.Vector3();
function computeAccelerations(){
  for(const s of state) s.a.set(0,0,0);
  for(let i=0;i<state.length;i++){
    const si = state[i];
    for(let j=0;j<state.length;j++){
      if(i===j) continue;
      const sj = state[j];
      let srcPos = sj.p;
      if(useDelay && si.history.length > 1){
        // si から見た sj の見かけの距離で遅延を決める（現在位置で近似→遅延位置）
        const approxDist = si.p.distanceTo(sj.p);
        const delay = approxDist / C;
        srcPos = delayedPos(sj, delay);
      }
      tmp.subVectors(srcPos, si.p);
      const r2 = tmp.lengthSq();
      if(r2 === 0) continue;
      const r = Math.sqrt(r2);
      const f = G * sj.mass / r2;
      si.a.addScaledVector(tmp, f / r);
    }
  }
}

// velocity Verlet 1ステップ
function stepPhysics(dt){
  // 半ステップ速度
  for(const s of state) s.v.addScaledVector(s.a, dt*0.5);
  // 位置更新
  for(const s of state) s.p.addScaledVector(s.v, dt);
  pushHistory();
  computeAccelerations();
  // 残り半ステップ速度
  for(const s of state) s.v.addScaledVector(s.a, dt*0.5);
  simSeconds += dt;
}

// 初期加速度
pushHistory();
computeAccelerations();

// ============================================================
// 描画 (Three.js)
// ============================================================
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.01, 100000);
camera.position.set(0, 120, 240);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// 画面スケール: 1 AU = SCALE three.js units
const SCALE = 40;
function toScene(v){ return new THREE.Vector3(v.x/AU*SCALE, v.z/AU*SCALE, -v.y/AU*SCALE); }

// 星空背景
(function addStars(){
  const g = new THREE.BufferGeometry();
  const N = 3000, arr = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r = 8000 + Math.random()*4000;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    arr[i*3]   = r*Math.sin(ph)*Math.cos(th);
    arr[i*3+1] = r*Math.cos(ph);
    arr[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  g.setAttribute('position', new THREE.BufferAttribute(arr,3));
  const m = new THREE.PointsMaterial({ color:0xffffff, size:2, sizeAttenuation:false });
  scene.add(new THREE.Points(g,m));
})();

// 手続き的テクスチャ生成（簡易）
function makePlanetTexture(baseColor, opts={}){
  const size = 256;
  const cv = document.createElement('canvas'); cv.width=size; cv.height=size;
  const ctx = cv.getContext('2d');
  const c = new THREE.Color(baseColor);
  ctx.fillStyle = `rgb(${c.r*255|0},${c.g*255|0},${c.b*255|0})`;
  ctx.fillRect(0,0,size,size);
  // ノイズ斑点
  for(let i=0;i<2500;i++){
    const x=Math.random()*size, y=Math.random()*size, r=Math.random()*3+0.5;
    const d=(Math.random()-0.5)*0.4;
    const cc=c.clone(); cc.offsetHSL(0,0,d);
    ctx.fillStyle=`rgba(${cc.r*255|0},${cc.g*255|0},${cc.b*255|0},0.5)`;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  // 帯（木星・土星向け）
  if(opts.bands){
    for(let y=0;y<size;y+=8){
      const d=(Math.random()-0.5)*0.35;
      const cc=c.clone(); cc.offsetHSL(0,0,d);
      ctx.fillStyle=`rgba(${cc.r*255|0},${cc.g*255|0},${cc.b*255|0},0.4)`;
      ctx.fillRect(0,y,size,4+Math.random()*4);
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  return tex;
}

// 太陽の光源
const sunLight = new THREE.PointLight(0xffffff, 3, 0, 0.0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x222233, 1.2));

// 各天体のメッシュ・トレイル
const meshes = [];
const trails = [];
const labelEls = [];
const TRAIL_MAX = 1500;

BODIES.forEach((b, idx)=>{
  const r = b.radius;
  const geo = new THREE.SphereGeometry(r, 48, 32);
  let mat;
  if(b.emissive){
    mat = new THREE.MeshBasicMaterial({ color:b.color });
  } else {
    const tex = makePlanetTexture(b.color, { bands: b.bands });
    mat = new THREE.MeshStandardMaterial({ map:tex, roughness:0.85, metalness:0.0 });
  }
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  meshes.push(mesh);

  // 太陽グロー
  if(b.emissive){
    const glowMat = new THREE.SpriteMaterial({
      map: makeGlowTexture(b.color), color:0xffffff, transparent:true,
      blending:THREE.AdditiveBlending, depthWrite:false });
    const glow = new THREE.Sprite(glowMat);
    glow.scale.set(r*6, r*6, 1);
    mesh.add(glow);
  }

  // 土星の環
  if(b.rings){
    const ringGeo = new THREE.RingGeometry(r*1.4, r*2.4, 64);
    // UVを半径方向に
    const pos = ringGeo.attributes.position;
    const uv = ringGeo.attributes.uv;
    const v3 = new THREE.Vector3();
    for(let i=0;i<pos.count;i++){
      v3.fromBufferAttribute(pos,i);
      const rr = v3.length();
      uv.setXY(i, (rr - r*1.4)/(r*2.4 - r*1.4), 0.5);
    }
    const ringMat = new THREE.MeshBasicMaterial({
      map: makeRingTexture(b.color), side:THREE.DoubleSide,
      transparent:true, opacity:0.85, depthWrite:false });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI/2 - 0.47; // 環の傾き
    mesh.add(ring);
  }

  // トレイル
  const tgeo = new THREE.BufferGeometry();
  tgeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_MAX*3),3));
  tgeo.setDrawRange(0,0);
  const tmat = new THREE.LineBasicMaterial({ color:b.color, transparent:true, opacity:0.5 });
  const line = new THREE.Line(tgeo, tmat);
  scene.add(line);
  trails.push({ line, points:[], head:0, count:0 });

  // ラベル
  const el = document.createElement('div');
  el.textContent = b.name;
  el.style.cssText = 'position:absolute;color:#cde;font-size:11px;pointer-events:none;text-shadow:0 0 3px #000;transform:translate(-50%,-150%);white-space:nowrap;';
  document.body.appendChild(el);
  labelEls.push(el);
});

function makeGlowTexture(color){
  const s=128, cv=document.createElement('canvas'); cv.width=s; cv.height=s;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  const c=new THREE.Color(color);
  g.addColorStop(0,`rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},1)`);
  g.addColorStop(0.3,`rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},0.5)`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(cv);
}
function makeRingTexture(color){
  const w=256,h=8, cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d');
  const c=new THREE.Color(color);
  for(let x=0;x<w;x++){
    const a = 0.3 + 0.6*Math.abs(Math.sin(x*0.35)) * (0.5+0.5*Math.random());
    const d=(Math.random()-0.5)*0.2;
    const cc=c.clone(); cc.offsetHSL(0,0,d);
    ctx.fillStyle=`rgba(${cc.r*255|0},${cc.g*255|0},${cc.b*255|0},${a})`;
    ctx.fillRect(x,0,1,h);
  }
  return new THREE.CanvasTexture(cv);
}

// 凡例
const legend = document.getElementById('legend');
BODIES.forEach(b=>{
  const span=document.createElement('span');
  span.innerHTML=`<span class="dot" style="background:#${b.color.toString(16).padStart(6,'0')}"></span>${b.name}`;
  legend.appendChild(span);
});

// ============================================================
// トレイル更新
// ============================================================
function updateTrail(i){
  const t = trails[i];
  const sp = toScene(state[i].p);
  const arr = t.line.geometry.attributes.position.array;
  if(t.count < TRAIL_MAX){
    arr[t.count*3]=sp.x; arr[t.count*3+1]=sp.y; arr[t.count*3+2]=sp.z;
    t.count++;
  } else {
    // シフト
    arr.copyWithin(0, 3);
    arr[(TRAIL_MAX-1)*3]=sp.x; arr[(TRAIL_MAX-1)*3+1]=sp.y; arr[(TRAIL_MAX-1)*3+2]=sp.z;
  }
  t.line.geometry.setDrawRange(0, t.count);
  t.line.geometry.attributes.position.needsUpdate = true;
}

// ============================================================
// 日付計算・表示
// ============================================================
const dateEl = document.getElementById('date');
const elapsedEl = document.getElementById('elapsed');
function updateDate(){
  const d = new Date(EPOCH.getTime() + simSeconds*1000);
  const y = d.getUTCFullYear();
  const mo = String(d.getUTCMonth()+1).padStart(2,'0');
  const da = String(d.getUTCDate()).padStart(2,'0');
  dateEl.textContent = `${y}年${mo}月${da}日`;
  const years = simSeconds/YEAR;
  elapsedEl.textContent = `元期(J2000)から ${years>=0?'+':''}${years.toFixed(2)} 年`;
}

// ============================================================
// UI
// ============================================================
const speedSlider = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
function applySpeed(){
  yearsPerSecond = Math.pow(10, parseFloat(speedSlider.value));
  speedVal.textContent = `1秒 = ${yearsPerSecond.toFixed(yearsPerSecond<1?3:2)} 年`;
}
speedSlider.addEventListener('input', applySpeed);
applySpeed();

const pauseBtn = document.getElementById('pause');
pauseBtn.addEventListener('click', ()=>{
  running = !running;
  pauseBtn.textContent = running ? '⏸ 一時停止' : '▶ 再生';
});

document.getElementById('reset').addEventListener('click', ()=>{
  // 状態を初期化
  BODIES.forEach((b,i)=>{
    state[i].p.set(b.pos[0]*AU, b.pos[1]*AU, b.pos[2]*AU);
    state[i].v.set(b.vel[0]*AU/DAY, b.vel[1]*AU/DAY, b.vel[2]*AU/DAY);
    state[i].history.length = 0;
  });
  // 運動量再補正
  const totalP=new THREE.Vector3();
  for(const s of state) totalP.addScaledVector(s.v, s.mass);
  state[0].v.addScaledVector(totalP, -1/state[0].mass);
  simSeconds = 0;
  trails.forEach(t=>{ t.count=0; t.line.geometry.setDrawRange(0,0); });
  pushHistory(); computeAccelerations();
});

document.getElementById('delay').addEventListener('change', e=>{ useDelay = e.target.checked; });
document.getElementById('trails').addEventListener('change', e=>{
  showTrails = e.target.checked;
  trails.forEach(t=> t.line.visible = showTrails);
});

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// メインループ
// ============================================================
let lastTime = performance.now();
let trailTimer = 0;
const _v = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  let realDt = (now - lastTime)/1000;
  lastTime = now;
  if(realDt > 0.1) realDt = 0.1; // タブ復帰時の暴走防止

  if(running){
    // このフレームで進めるべきシミュレーション秒数
    const simAdvance = realDt * yearsPerSecond * YEAR;
    let steps = Math.round(simAdvance / PHYS_DT);
    steps = Math.min(steps, 2000); // 1フレームあたり上限
    if(steps < 1 && simAdvance > 0) steps = 1;
    for(let k=0;k<steps;k++){
      stepPhysics(PHYS_DT);
      trailTimer++;
      if(showTrails && (trailTimer % 4 === 0)){
        for(let i=1;i<state.length;i++) updateTrail(i);
      }
    }
  }

  // メッシュ位置更新 + 自転
  for(let i=0;i<state.length;i++){
    meshes[i].position.copy(toScene(state[i].p));
    meshes[i].rotation.y += 0.01;
  }
  // 太陽光源を太陽位置へ
  sunLight.position.copy(meshes[0].position);

  controls.update();
  renderer.render(scene, camera);
  updateDate();

  // ラベル位置をスクリーン座標へ投影
  for(let i=0;i<state.length;i++){
    _v.copy(meshes[i].position).project(camera);
    if(_v.z > 1 || _v.z < -1){ labelEls[i].style.display='none'; continue; }
    const x = (_v.x*0.5+0.5)*window.innerWidth;
    const y = (-_v.y*0.5+0.5)*window.innerHeight;
    labelEls[i].style.display='block';
    labelEls[i].style.left = x+'px';
    labelEls[i].style.top = y+'px';
  }
}
animate();
</script>
