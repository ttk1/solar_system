<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太陽系シミュレーター</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; }
  #ui {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    color: #eee; background: rgba(10,12,24,0.65); padding: 12px 14px;
    border-radius: 10px; backdrop-filter: blur(4px); user-select: none;
    font-size: 13px; line-height: 1.7; min-width: 240px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  #date { font-size: 18px; font-weight: bold; color: #9fd; letter-spacing: 0.5px; }
  #uiHead { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  #uiToggle {
    background:#26304d; color:#cde; border:1px solid #3a4a72; border-radius:6px;
    padding:2px 8px; cursor:pointer; font-size:13px; line-height:1.4; flex:0 0 auto;
  }
  #uiToggle:hover { background:#33406a; }
  #ui.collapsed { min-width:0; }
  #ui.collapsed #uiBody { display:none; }
  #ui label { display: block; margin-top: 6px; }
  #ui input[type=range] { width: 100%; }
  #ui input[type=date] { background:#26304d; color:#cde; border:1px solid #3a4a72; border-radius:6px; padding:2px 6px; font-size:12px; }
  .row { display:flex; justify-content: space-between; align-items:center; gap:8px; }
  .small { color:#9ab; font-size: 11px; }
  button {
    background:#26304d; color:#cde; border:1px solid #3a4a72; border-radius:6px;
    padding:4px 10px; cursor:pointer; font-size:12px;
  }
  button:hover { background:#33406a; }
  #legend { margin-top:8px; font-size:11px; color:#bcd; }
  #legend span { display:inline-block; margin-right:8px; white-space:nowrap; }
  #legend span:hover { text-decoration:underline; }   /* クリックで天体にフォーカスできる目印 */
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:middle; margin-right:3px; }
  #hint { position:absolute; bottom:10px; left:10px; color:#778; font-size:11px; z-index:10; }
  #fun { margin-top:10px; padding-top:8px; border-top:1px solid #3a4a72; }
  #fun .fun-title { font-size:12px; color:#e9b; margin-bottom:6px; }
  #fun button { display:block; width:100%; }
  #fun label { display:block; margin-top:6px; font-size:13px; }
  #fun input[type=range] { width:100%; }
</style>
</head>
<body>
<div id="ui">
  <div id="uiHead">
    <div id="date">----</div>
    <button id="uiToggle" title="メニューの表示切替" aria-label="メニューの表示切替">▾</button>
  </div>
  <div id="uiBody">
  <div class="small" id="elapsed"></div>
  <label>シミュレーション速度
    <div class="row"><span class="small" id="speedVal"></span></div>
    <input type="range" id="speed" min="-7.5" max="3" step="0.01" value="0">
  </label>
  <div class="small">スライダー: 対数（左=等倍 … 右=1000年/秒）</div>
  <div class="row" style="margin-top:8px;">
    <button id="pause">⏸ 一時停止</button>
    <button id="reset">↺ リセット</button>
  </div>
  <div class="row" style="margin-top:6px;">
    <button id="now" style="width:100%;">⏩ 現在へ早送り</button>
  </div>
  <div class="row" style="margin-top:6px; gap:4px;">
    <input type="date" id="gotoDate" style="flex:1; min-width:0;">
    <button id="gotoBtn">移動</button>
  </div>
  <label class="row" style="margin-top:8px;">
    <span>軌道トレイル表示</span>
    <input type="checkbox" id="trails" checked>
  </label>
  <label class="row">
    <span>天体名を表示</span>
    <input type="checkbox" id="labels" checked>
  </label>
  <label class="row">
    <span>背景の星を表示</span>
    <input type="checkbox" id="stars" checked>
  </label>
  <label class="row">
    <span>銀河公転モード</span>
    <input type="checkbox" id="galaxy">
  </label>
  <label class="row">
    <span>実スケール表示</span>
    <input type="checkbox" id="realSize">
  </label>
  <div class="small" id="realSizeNote" style="display:none;color:#fc9;">
    ※実際の半径で描画。距離に対し極小のため、ほぼ点になります。
  </div>
  <details id="earthTune" style="margin-top:8px;">
    <summary style="cursor:pointer;color:#9ab;font-size:12px;">地球 自転軸の調整</summary>
    <label>自転位相 <span class="small" id="phaseVal"></span>
      <input type="range" id="earthPhase" min="-180" max="180" step="1">
    </label>
    <label>軸の向き（黄経） <span class="small" id="axisVal"></span>
      <input type="range" id="earthAxis" min="0" max="360" step="1">
    </label>
    <div class="small">合った値をソースの EARTH_PHASE0 / EARTH_AXIS_LON に焼き込めます</div>
  </details>
  <div id="legend"></div>
  <div id="fun">
    <div class="fun-title">🎲 面白機能</div>
    <label class="row">
      <span>🌍 地表モード（地球から空を見上げる）</span>
      <input type="checkbox" id="surface">
    </label>
    <div id="surfaceNote" style="display:none;">
      <div class="small" style="color:#9cf;">ドラッグで首振り / ホイールで視野(ズーム)。自転で星空が流れます。</div>
      <label class="small">観測 緯度（北緯+） <span id="obsLatVal"></span>
        <input type="range" id="obsLat" min="-90" max="90" step="1">
      </label>
      <label class="small">観測 経度（東経+） <span id="obsLonVal"></span>
        <input type="range" id="obsLon" min="-180" max="180" step="1">
      </label>
      <div class="small">地理座標で指定（例: 東京 35.7, 139.7）。値は OBS_LAT_DEG / OBS_LON_DEG に焼き込めます</div>
    </div>
    <button id="alignBtn">🪐 次の惑星直列へ</button>
    <button id="cometBtn" style="margin-top:6px;">☄ 彗星を発射</button>
    <label class="row" style="margin-top:6px;">
      <span>☄ ランダムに飛来</span>
      <input type="checkbox" id="autoComet">
    </label>
    <label style="margin-top:8px;">☀ 太陽質量 <span class="small" id="sunMassVal"></span>
      <input type="range" id="sunMass" min="0" max="10" step="0.1" value="1">
    </label>
    <label>🌌 重力定数 <span class="small" id="gMulVal"></span>
      <input type="range" id="gMul" min="0" max="10" step="0.1" value="1">
    </label>
    <button id="physReset" style="margin-top:4px;">物理を等倍に戻す</button>
  </div>
  </div>
</div>
<div id="hint">マウス: 左ドラッグ=回転 / 右ドラッグ=移動 / ホイール=拡大縮小</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// 物理定数
// ============================================================
// 重力は G·m ではなく各天体の GM（重力パラメータ）を直接使うため、万有引力定数 G は
// 物理計算には不要（GM は観測から高精度に決まる量で、G 単体より誤差が小さい）。
const C_LIGHT = 2.99792458e8;  // 光速 [m/s]（一般相対論補正に使用）
const AU = 1.495978707e11;      // 天文単位 [m]
const DAY = 86400;              // 1日 [s]
const YEAR = 365.25 * DAY;      // 1年 [s]

// ============================================================
// 銀河公転（実スケール）
//  実際: 太陽系は銀河中心を半径~2.6万光年、周期~2.25億年、速度~220km/sで公転。
//  描画は「太陽系原点系」: 惑星は常に原点付近に置いて float32 精度を保ち、
//  トレイルだけを銀河公転の変位ぶん動かす。これにより実スケール(巨大半径)でも
//  座標破綻せず、らせん状の軌跡が見える。
//  銀河公転速度は地球公転速度の約7.4倍(220/29.8)。実半径は桁違いに大きいので、
//  トレイルはほぼ直線的に高速で流れ、銀河中心は遥か彼方で画面には映らない。
// ============================================================
const GALAXY_REAL_PERIOD = 2.25e8 * YEAR;   // 実際の公転周期 [s]
const GALAXY_SPEED_RATIO = 220 / 29.8;      // 銀河公転速度 / 地球公転速度 ≈ 7.4

// ============================================================
// 天体データ
//  pos/vel: NASA/JPL HORIZONS (DE441) から取得した元期
//           (2000-01-01 00:00:00 TDB, JD 2451544.5) の太陽系重心 (SSB) 基準
//           状態ベクトル。座標系=黄道面・J2000.0。pos [AU], vel [AU/day]。
//           太陽も SSB に対して動く（重心は全天体で決まる）点に注意。
//  gm:   重力パラメータ GM [m^3/s^2]。質量 m × G ではなく GM を直接持つ。
//        理由: N 体計算で必要なのは G·m_j の積で、観測から高精度に決まるのは
//        GM のほう（G 単体・m 単体は不確かさが大きい）。惑星は「惑星系重心」の
//        GM（本体＋衛星）を採用し衛星込みの運動を 1 質点で正確に表す。地球・月
//        のみ個別本体の GM。出典 JPL DE440/DE441（km^3/s^2 を ×1e9 して m^3/s^2）。
//  mass: 質量 [kg]（参考情報。重力計算には使わず gm を使う。現状コードからは
//        参照していないが、各天体の素性を残す意味で保持している）
//  radius: 表示用の見やすさ優先半径（実スケールではない）
//  realRadiusKm: 実際の半径 [km]（「実スケール表示」用）
//  color: 基本色
//  rotHours: 自転周期 [時間]（恒星日）。負値は逆行自転（金星・天王星）。
//  tiltDeg: 赤道傾斜角 [度]（自転軸の傾き）。土星の環もこの傾きの赤道面に置く。
// ============================================================
const BODIES = [
  { name:'太陽',     mass:1.98892e30, gm:1.32712440041279419e20, radius:12, realRadiusKm:696000, color:0xffcc33, emissive:true, rotHours:609.12, tiltDeg:7.25,
    pos:[-7.139867342351966e-3,-2.792293024590130e-3, 2.063456515496323e-4],
    vel:[ 5.374261984736907e-6,-7.410968933449048e-6,-9.423856739196387e-8] },
  { name:'水星',     mass:3.3011e23,  gm:2.2031868551e13,         radius:2.2, realRadiusKm:2440, color:0xa9a9a9, rotHours:1407.6, tiltDeg:0.03,
    pos:[-1.478679470531864e-1,-4.466932510516238e-1,-2.313921354816243e-2],
    vel:[ 2.117424562091145e-2,-7.105386389490768e-3,-2.522925269286375e-3] },
  { name:'金星',     mass:4.8675e24,  gm:3.2485859200e14,         radius:3.6, realRadiusKm:6052, color:0xe8c87a, rotHours:-5832.5, tiltDeg:177.4,
    pos:[-7.257700842628457e-1,-2.529609371887610e-2, 4.137818693791793e-2],
    vel:[ 5.189070091302415e-4,-2.031355259141011e-2,-3.072687586355490e-4] },
  // 地表テクスチャは Solar System Scope (CC BY 4.0) を同梱 — README にクレジット記載
  { name:'地球',     mass:5.97237e24, gm:3.9860043550702266e14,   radius:3.8, realRadiusKm:6371, color:0x2a6dd6, rotHours:23.9345, tiltDeg:23.44,
    textureUrl:'textures/2k_earth_daymap.jpg',
    pos:[-1.756645157282301e-1, 9.659910118824406e-1, 2.022251612712026e-4],
    vel:[-1.722857157049219e-2,-3.015071218794761e-3,-5.861283850800269e-8] },
  // 月: 地球の運動(本体 vs 地球-月重心)を正しく扱うため質点として追加。moon:true で
  // 直列判定から除外し、トレイル間隔も地球周回に合わせて細かくする。同期回転(公転=自転)。
  { name:'月',       mass:7.342e22,   gm:4.9028000661637961e12,   radius:1.4, realRadiusKm:1737, color:0xb0b0b0, moon:true, rotHours:655.7, tiltDeg:6.68,
    pos:[-1.777878764405764e-1, 9.643741227174606e-1, 4.465857454550972e-4],
    vel:[-1.690468993845242e-2,-3.477070757639961e-3,-1.005406895923388e-6] },
  { name:'火星',     mass:6.4171e23,  gm:4.282837362069909e13,    radius:2.8, realRadiusKm:3390, color:0xc1440e, rotHours:24.6229, tiltDeg:25.19,
    pos:[ 1.383221198696930e+0,-2.380201528263098e-2,-3.441166875780344e-2],
    vel:[ 7.533013826049672e-4, 1.517888771847333e-2, 2.996589800130572e-4] },
  { name:'木星',     mass:1.8982e27,  gm:1.266865319003704e17,    radius:9,  realRadiusKm:69911, color:0xd2a679, bands:true, rotHours:9.925, tiltDeg:3.13,
    pos:[ 3.996320240617948e+0, 2.932561322812968e+0,-1.016166899919226e-1],
    vel:[-4.558099055829463e-3, 6.439346910520061e-3, 7.536227172818839e-5] },
  { name:'土星',     mass:5.6834e26,  gm:3.793120615901047e16,    radius:8,  realRadiusKm:58232, color:0xe3d9a6, rings:true, rotHours:10.656, tiltDeg:26.73,
    pos:[ 6.401414860101278e+0, 6.565251849775630e+0,-3.689215367531211e-1],
    vel:[-4.285745446165197e-3, 3.884169714004272e-3, 1.027825501934837e-4] },
  { name:'天王星',   mass:8.6810e25,  gm:5.793951256527211e15,    radius:5.5, realRadiusKm:25362, color:0x9fdce3, rotHours:-17.24, tiltDeg:97.77,
    pos:[ 1.442337762564843e+1,-1.373845004643807e+1,-2.379229549751449e-1],
    vel:[ 2.683754231364985e-3, 2.665031702164245e-3,-2.487086513248259e-5] },
  { name:'海王星',   mass:1.02413e26, gm:6.835103145462294e15,    radius:5.3, realRadiusKm:24622, color:0x3f66c9, rotHours:16.11, tiltDeg:28.32,
    pos:[ 1.680361743975454e+1,-2.499544359984831e+1, 1.274771802323617e-1],
    vel:[ 2.584743826368553e-3, 1.769358367628613e-3,-9.600326572966503e-5] },
];

// 重力源としてのみ参加する摂動天体（冥王星＋主要小惑星）。描画・直列判定には
// 出さず、太陽系の質量分布をより忠実にするために足す。DE441 などの高精度暦も
// 小惑星を質点として含む。主要 4 個だけでは外惑星への寄与はごく小さい（本来は
// 小惑星帯の数百個ぶんの連続質量が要る）が、冥王星を含め「より本物に近いモデル」
// にする位置づけ。gm は m^3/s^2、pos/vel は 2000-01-01 SSB の AU, AU/day。
const PERTURBERS = [
  { name:'Pluto',  gm:9.755011621830380e11,
    pos:[-9.884006460487134e+0,-2.796081998964971e+1, 5.851008355643481e+0],
    vel:[ 3.034076299948153e-3,-1.545343061016808e-3,-7.122656089324716e-4] },
  { name:'Ceres',  gm:6.26284e10,
    pos:[-2.384670160017479e+0, 7.979849433467894e-1, 4.630439590237156e-1],
    vel:[-3.600047968504067e-3,-1.058624433538979e-2, 3.378848061265286e-4] },
  { name:'Vesta',  gm:1.728828e10,
    pos:[-1.365527753318191e+0,-1.672221471290490e+0, 2.155802232419442e-1],
    vel:[ 9.610352589661171e-3,-7.434583262277168e-3,-9.426532268841708e-4] },
  { name:'Pallas', gm:1.363e10,
    pos:[-8.424063924047979e-1, 1.653001909633650e+0,-1.075587845059179e+0],
    vel:[-1.174474843421834e-2,-4.104535510998074e-3, 3.801225226581635e-3] },
  { name:'Hygiea', gm:7.0e9,
    pos:[-2.384253191822651e+0,-1.461885924698006e+0,-1.780903340597545e-1],
    vel:[ 6.099000124059932e-3,-8.966636323506472e-3, 2.554707610148175e-4] },
];

// 重力計算に参加する全天体（可視 BODIES ＋ 非可視 PERTURBERS）。描画ループは
// 先頭の BODIES.length 個（= 可視天体）だけを回す。N_VISIBLE がその境界。
const ALL_BODIES = BODIES.concat(PERTURBERS);
const N_VISIBLE = BODIES.length;

// 位置・速度を SI 単位 (m, m/s) に変換した状態ベクトル。
// 重力計算は gm（GM, m^3/s^2）を使う。
const state = ALL_BODIES.map(b => ({
  name: b.name,
  gm: b.gm,                // 重力パラメータ GM [m^3/s^2]（重力計算はこれを使う）
  p: new THREE.Vector3(),
  v: new THREE.Vector3(),
  a: new THREE.Vector3(),
}));

// 全系の重心の位置・速度をゼロにする（SSB 静止系へ）。入力は既に SSB だが、
// 桁落ち・データ丸めで残る微小ドリフトを除去して長期計算の基準を安定させる。
// 重み付けは GM（質量に比例）。
function removeBarycenterDrift(){
  let totGm = 0;
  const c = new THREE.Vector3(), cv = new THREE.Vector3();
  for(const s of state){ totGm += s.gm; c.addScaledVector(s.p, s.gm); cv.addScaledVector(s.v, s.gm); }
  c.multiplyScalar(1/totGm); cv.multiplyScalar(1/totGm);
  for(const s of state){ s.p.sub(c); s.v.sub(cv); }
}

// 全天体を元期の状態ベクトルへ戻す（初期化・リセット共通）。摂動天体も含めて
// 戻すので、リセット後も外惑星の摂動が正しく効く。
function initState(){
  for(let i=0;i<ALL_BODIES.length;i++){
    const b = ALL_BODIES[i];
    state[i].p.set(b.pos[0]*AU, b.pos[1]*AU, b.pos[2]*AU);
    state[i].v.set(b.vel[0]*AU/DAY, b.vel[1]*AU/DAY, b.vel[2]*AU/DAY);
  }
  removeBarycenterDrift();
}
initState();

// ============================================================
// シミュレーション設定
// ============================================================
const EPOCH = new Date(Date.UTC(2000,0,1,0,0,0)); // 元期 2000-01-01 00:00 TDB (≈UTC), JD 2451544.5
let simSeconds = 0;          // 経過シミュレーション秒
let running = true;
let yearsPerSecond = 1.0;    // 実時間1秒あたりのシミュレーション年数
let showTrails = true;
let showLabels = true;       // 天体名ラベルの表示
let realSize = false;        // 実スケール表示（月は実スケール時のみ見せる）
let sunMassMul = 1.0;        // 面白機能: 太陽質量の倍率
let gMul = 1.0;              // 面白機能: 重力定数の倍率
// 面白機能: 彗星（test particle。重力は受けるが惑星には影響しない）
//  各要素 { p, v, a:Vector3, mesh, tail, tailPos:[] }
const comets = [];
// 早送り(キャッチアップ)中の状態。null=通常。
//  { target: ()=>目標simSeconds, onArrive: ()=>到達時の処理 }
let catchup = null;
let focusIndex = null;       // カメラ中心にする天体の index（null=フォーカスなし）

// 物理積分の1ステップ上限（シミュレーション秒）= 0.05日。
// Yoshida 4次が高精度なため、これでエネルギー誤差はほぼ倍精度の限界(~9e-15)。
const PHYS_DT = 0.05 * DAY;

// 太陽による一般相対論(1PN, Schwarzschild)補正加速度を accOut に加える。
//   a_GR = GM/(c^2 r^3) [ (4GM/r − v^2) r + 4(r·v) v ]
// r,v は太陽中心から見た相対位置・速度。水星の近日点移動(43″/世紀)を再現する標準形。
// 太陽項が支配的なので太陽のみ考慮（外惑星への寄与は無視できる）。面白機能の倍率
// gMul/sunMassMul とも整合させる。
const _grR = new THREE.Vector3();
const _grV = new THREE.Vector3();
function addSunGR(p, v, accOut){
  const sun = state[0];
  _grR.subVectors(p, sun.p);          // 太陽中心からの相対位置
  const r2 = _grR.lengthSq();
  if(r2 === 0) return;
  _grV.subVectors(v, sun.v);          // 太陽に対する相対速度
  const r = Math.sqrt(r2);
  // 太陽の実効 GM（面白機能の倍率を反映）。重力計算と同じ定義を使う。
  const GM = sun.gm * gMul * sunMassMul;
  const v2 = _grV.lengthSq();
  const rDotV = _grR.dot(_grV);
  const k = GM / (C_LIGHT*C_LIGHT * r2 * r); // GM/(c^2 r^3)
  // accOut += k[(4GM/r − v^2) r + 4(r·v) v]
  accOut.addScaledVector(_grR, k * (4*GM/r - v2));
  accOut.addScaledVector(_grV, k * 4 * rDotV);
}

// 加速度計算（ニュートン重力, 瞬時作用 ＋ 太陽の一般相対論補正）。
// 重力は質量×G ではなく各天体の GM（重力パラメータ）を直接使う。観測から
// 高精度に決まる量なので、G と m を別々に持つより誤差が小さい。
const tmp = new THREE.Vector3();
function computeAccelerations(){
  for(const s of state) s.a.set(0,0,0);
  for(let i=0;i<state.length;i++){
    const si = state[i];
    for(let j=0;j<state.length;j++){
      if(i===j) continue;
      const sj = state[j];
      tmp.subVectors(sj.p, si.p);
      const r2 = tmp.lengthSq();
      if(r2 === 0) continue;
      const r = Math.sqrt(r2);
      // 面白機能の倍率: 全 GM に gMul、太陽(index 0)の GM に sunMassMul を掛ける
      const gmj = (j === 0) ? sj.gm * sunMassMul : sj.gm;
      const f = gMul * gmj / r2;
      si.a.addScaledVector(tmp, f / r);
    }
    // 太陽以外の天体に GR 補正を加える（太陽自身 i=0 には加えない）
    if(i !== 0) addSunGR(si.p, si.v, si.a);
  }
  // 彗星(test particle): 全天体から重力を受ける。惑星側へは影響しない。
  for(const cmt of comets){
    cmt.a.set(0,0,0);
    for(let j=0;j<state.length;j++){
      const sj = state[j];
      tmp.subVectors(sj.p, cmt.p);
      const r2 = tmp.lengthSq();
      if(r2 === 0) continue;
      const r = Math.sqrt(r2);
      const gmj = (j === 0) ? sj.gm * sunMassMul : sj.gm;
      const f = gMul * gmj / r2;
      cmt.a.addScaledVector(tmp, f / r);
    }
    addSunGR(cmt.p, cmt.v, cmt.a); // 彗星にも太陽 GR 補正
  }
}

// Yoshida 4次シンプレクティック積分の係数（drift c[], kick d[]）。
//  w1 = 1/(2-2^(1/3)), w0 = -2^(1/3)*w1
const _Y_W1 = 1 / (2 - Math.cbrt(2));
const _Y_W0 = -Math.cbrt(2) * _Y_W1;
const Y_C = [_Y_W1/2, (_Y_W0+_Y_W1)/2, (_Y_W0+_Y_W1)/2, _Y_W1/2]; // 位置更新
const Y_D = [_Y_W1, _Y_W0, _Y_W1];                                 // 速度更新

function drift(dt){
  for(const s of state) s.p.addScaledVector(s.v, dt);
  for(const c of comets) c.p.addScaledVector(c.v, dt);
}
function kick(dt){
  for(const s of state) s.v.addScaledVector(s.a, dt);
  for(const c of comets) c.v.addScaledVector(c.a, dt);
}

// 1ステップ = Yoshida 4次シンプレクティック積分（3回force評価/step）。
// drift c1, kick d1, drift c2, kick d2, drift c3, kick d3, drift c4
function stepPhysics(dt){
  drift(Y_C[0]*dt);
  computeAccelerations(); kick(Y_D[0]*dt);
  drift(Y_C[1]*dt);
  computeAccelerations(); kick(Y_D[1]*dt);
  drift(Y_C[2]*dt);
  computeAccelerations(); kick(Y_D[2]*dt);
  drift(Y_C[3]*dt);
  computeAccelerations(); // 次ステップ・描画用に最新加速度を保持
  simSeconds += dt;
}

// 初期加速度
computeAccelerations();

// ============================================================
// 描画 (Three.js)
// ============================================================
const scene = new THREE.Scene();
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, logarithmicDepthBuffer:true });
} catch(e){
  document.body.innerHTML =
    '<div style="color:#fbb;font-family:sans-serif;padding:40px;line-height:1.8;">'
    + '<b>WebGL を初期化できませんでした。</b><br><br>'
    + 'WebGL対応のブラウザ（最新の Chrome / Edge / Firefox / Safari）で開いてください。<br>'
    + 'また、地球テクスチャの読み込みのため <code>http://localhost</code> 等のサーバー経由での起動を推奨します。'
    + '</div>';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); // 高DPIで重くなりすぎないよう上限2
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// near は小さめ（実スケール表示で極小の天体にも寄れるよう）。深度精度は
// logarithmicDepthBuffer で確保。
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.001, 60000);
camera.position.set(0, 120, 240);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// 画面スケール: 1 AU = SCALE three.js units
// 水星の近日点(≈0.31AU)が太陽の表示半径に入り込まないよう、やや広めに取る。
const SCALE = 48;
function toScene(v){ return new THREE.Vector3(v.x/AU*SCALE, v.z/AU*SCALE, -v.y/AU*SCALE); }

// 地球の自転位相オフセット[rad]。昼夜が日時に合うよう調整（画面のつまみで調整可）。
// 元期 2000-01-01 00:00 TDB を基準とした既定値。厳密な恒星時の再現が目的ではなく、
// 見た目の昼夜を日時感覚に合わせるためのもの（必要なら画面のつまみで微調整できる）。
let EARTH_PHASE0 = 90 * Math.PI / 180;

// 地球の自転軸（慣性空間で固定、シーン座標の単位ベクトル）。
//  黄道傾斜 ε=23.44°、北極が黄経 EARTH_AXIS_LON 方向へ倒れる。軸を公転位置に
//  よらず固定することで季節（夏至に北極が太陽側=白夜 等）が再現される。
//  実黄道座標 (sinε cosλ, sinε sinλ, cosε) を toScene(v)=(vx,vz,-vy) で写す。
//  λ の物理値: 北天の極は黄道座標で (0, sinε, cosε)、すなわち黄経90°方向に投影される
//  （北極星が黄経90°側へ倒れる）。よって EARTH_AXIS_LON = 90°（従来は目視で85°としていた）。
const EARTH_TILT = 23.44 * Math.PI / 180;
let EARTH_AXIS_LON = 90 * Math.PI / 180; // 軸が倒れる黄経方向（北天の極の黄経=90°）
const EARTH_AXIS = new THREE.Vector3();
function computeEarthAxis(){
  const s = Math.sin(EARTH_TILT), c = Math.cos(EARTH_TILT);
  const ex = s*Math.cos(EARTH_AXIS_LON), ey = s*Math.sin(EARTH_AXIS_LON), ez = c; // 実黄道
  EARTH_AXIS.set(ex, ez, -ey).normalize(); // toScene 写像
}
computeEarthAxis();
// 地球姿勢用: メッシュのローカルy軸(=テクスチャの北極)を EARTH_AXIS に向ける回転 ×
// その軸まわりの自転。これで北極点が回転軸に一致する。
const _earthTiltQuat = new THREE.Quaternion();
const _earthSpinQuat = new THREE.Quaternion();
const _yAxis = new THREE.Vector3(0,1,0);

// 銀河公転モード（太陽系原点系）
let galaxyMode = false;
// 黄道面（惑星の公転面）に対する銀河面の傾き。実際は約63°。
const GALAXY_TILT = 63 * Math.PI / 180;
const _galaxyCosT = Math.cos(GALAXY_TILT), _galaxySinT = Math.sin(GALAXY_TILT);

// 地球公転のシーン上の接線速度 [units/年]。半径 1AU=SCALE units を1年で1周。
const EARTH_TANGENTIAL = 2 * Math.PI * SCALE;
// 銀河公転の接線速度 [units/年]（地球公転の約7.4倍）と角速度 [rad/年]。
// 太陽系原点系では実半径(巨大)を直接使わず、接線速度と向きだけで変位を積む。
const GALAXY_SPEED = EARTH_TANGENTIAL * GALAXY_SPEED_RATIO;
const GALAXY_OMEGA = 2 * Math.PI / (GALAXY_REAL_PERIOD / YEAR);

// 太陽系の銀河公転による累積変位 [units]（太陽系原点系でのトレイルの基準）。
// 毎物理ステップで微小変位を接線方向へ積む。omega が極小なので実時間では
// 向きはほとんど回らず、軌跡はほぼ直線的に流れる（実際の銀河公転と同じ）。
let galaxyAngle = 0;
const galaxyDisp = new THREE.Vector3();
// dtYears 年ぶん、銀河公転変位を進める。
function advanceGalaxy(dtYears){
  if(!galaxyMode) return;
  const dth = GALAXY_OMEGA * dtYears;
  const move = GALAXY_SPEED * dtYears;   // この間に進む距離 [units]
  // 黄道面(XZ)円の接線方向 (-sinθ, 0, cosθ) へ move ぶん進む
  const s = Math.sin(galaxyAngle), c = Math.cos(galaxyAngle);
  const dx = -s * move;
  const dzFlat = c * move;
  // 63°傾ける（z成分を y,z に分配）
  galaxyDisp.x += dx;
  galaxyDisp.y += dzFlat * _galaxySinT;
  galaxyDisp.z += dzFlat * _galaxyCosT;
  galaxyAngle += dth;
}
// 銀河公転変位を返す（galaxyMode off のときはゼロベクトル相当）。
const _zeroVec = new THREE.Vector3();
function galaxyOffset(){ return galaxyMode ? galaxyDisp : _zeroVec; }

// トレイルは「太陽系から見た相対軌跡」に銀河公転変位を加えて蓄積する。
// 過去点は太陽系の進行と逆向きに流れていき、らせん(サイクロイド)になる。
// 注意: 惑星メッシュ自体は toScene のみ(原点付近)で描き、float32精度を保つ。
function toSceneGalaxy(v){
  return toScene(v).add(galaxyOffset());
}

// トレイル基準原点（ワールド銀河座標, float64 で CPU 側保持）。トレイル頂点は
// 「ワールド銀河座標 − trailRef」で float32 バッファに格納する。実スケールで天体に
// 寄ると、絶対座標(原点から数十 units)を float32 に詰める際の量子化(>天体の実半径)が
// 稲妻状のギザギザになる。基準を注視天体の近傍に置くと、格納値が極小になり float32
// 精度が保たれて滑らかになる。フォーカスなしでは原点(0)＝従来挙動。
const trailRef = new THREE.Vector3();
// 頂点格納用ヘルパ: ワールド銀河座標 v を trailRef 相対に変換して返す（破壊的・再利用）。
const _trailLocal = new THREE.Vector3();
function toTrailLocal(v){ return _trailLocal.copy(v).sub(trailRef); }

// 星空背景（オプションで表示ON/OFF。参照を保持して visible を切り替える）
const starField = (function addStars(){
  const g = new THREE.BufferGeometry();
  const N = 3000, arr = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r = 8000 + Math.random()*4000;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    arr[i*3]   = r*Math.sin(ph)*Math.cos(th);
    arr[i*3+1] = r*Math.cos(ph);
    arr[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  g.setAttribute('position', new THREE.BufferAttribute(arr,3));
  const m = new THREE.PointsMaterial({ color:0xffffff, size:2, sizeAttenuation:false });
  const pts = new THREE.Points(g,m);
  scene.add(pts);
  return pts;
})();

// 手続き的テクスチャ生成（簡易）
function makePlanetTexture(baseColor, opts={}){
  const size = 256;
  const cv = document.createElement('canvas'); cv.width=size; cv.height=size;
  const ctx = cv.getContext('2d');
  const c = new THREE.Color(baseColor);
  ctx.fillStyle = `rgb(${c.r*255|0},${c.g*255|0},${c.b*255|0})`;
  ctx.fillRect(0,0,size,size);
  // ノイズ斑点
  for(let i=0;i<2500;i++){
    const x=Math.random()*size, y=Math.random()*size, r=Math.random()*3+0.5;
    const d=(Math.random()-0.5)*0.4;
    const cc=c.clone(); cc.offsetHSL(0,0,d);
    ctx.fillStyle=`rgba(${cc.r*255|0},${cc.g*255|0},${cc.b*255|0},0.5)`;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  // 帯（木星・土星向け）
  if(opts.bands){
    for(let y=0;y<size;y+=8){
      const d=(Math.random()-0.5)*0.35;
      const cc=c.clone(); cc.offsetHSL(0,0,d);
      ctx.fillStyle=`rgba(${cc.r*255|0},${cc.g*255|0},${cc.b*255|0},0.4)`;
      ctx.fillRect(0,y,size,4+Math.random()*4);
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  return tex;
}

// 太陽の光源
const sunLight = new THREE.PointLight(0xffffff, 3, 0, 0.0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x222233, 1.2));

// 各天体のメッシュ・トレイル
// pivots[i]: 天体の位置・赤道傾斜を持つグループ。meshes[i](球)と環をその子に置く。
//   自転は meshes[i].rotation.y（pivot のローカルy=傾いた自転軸）で行うので、
//   傾いた軸まわりに本体が回り、環は赤道面に固定されたまま回らない。
const pivots = [];
const meshes = [];
const trails = [];
const labelEls = [];
const TRAIL_MAX = 1500;
// トレイルは「一定の軌道距離ごと」に点を打つ（時間基準ではない）。これにより
// シミュレーション速度を変えてもトレイルの長さがほぼ一定に保たれる（等倍付近で
// 消えなくなる）。保持される総長 ≈ TRAIL_SEG × TRAIL_MAX [units]。
const TRAIL_SEG = 0.3;
// 1フレームに打つトレイル点の上限。高速早送りでサブステップが数千になっても、点間隔は
// TRAIL_SEG で頭打ちのため大量に打っても見た目に寄与せず、updateTrail(全頂点コピー)の
// コストだけ増える。上限を設けて負荷を抑える(これ以上はトレイルが一瞬で全更新される)。
const TRAIL_PLOTS_MAX = 64;

// トレイル専用グループ。銀河公転モードでは毎フレーム位置を -galaxyDisp にして、
// 「太陽系基準で過去点が後ろに流れる」=らせんを表現する。グループ内のトレイル点は
// ワールド銀河座標 (toScene(v)+galaxyDisp) で蓄積する。
// 惑星メッシュはこのグループ外に置き、常に toScene(原点付近)で精度を保つ。
const trailGroup = new THREE.Group();
scene.add(trailGroup);

BODIES.forEach((b, idx)=>{
  const r = b.radius;
  const geo = new THREE.SphereGeometry(r, 48, 32);
  let mat;
  if(b.emissive){
    mat = new THREE.MeshBasicMaterial({ color:b.color });
  } else {
    // まず手続きテクスチャで初期化（外部画像の読込前・読込失敗時のフォールバック）
    const tex = makePlanetTexture(b.color, { bands: b.bands });
    mat = new THREE.MeshStandardMaterial({ map:tex, roughness:0.85, metalness:0.0 });
    // textureUrl があれば実画像を非同期ロードして差し替え（地球の実地表など）
    if(b.textureUrl){
      new THREE.TextureLoader().load(
        b.textureUrl,
        loaded => {
          loaded.colorSpace = THREE.SRGBColorSpace; // 色を正しく表示
          mat.map = loaded;
          mat.needsUpdate = true;
        },
        undefined,
        () => { /* 読込失敗時は手続きテクスチャのまま */ }
      );
    }
  }
  // pivot: 位置と赤道傾斜を持つ。自転軸(ローカルy)を tiltDeg だけ z 方向へ倒す。
  // 地球は慣性空間固定軸を quaternion で直接扱うため、pivot は傾けない（二重傾き回避）。
  const pivot = new THREE.Group();
  pivot.rotation.z = b.textureUrl ? 0 : (b.tiltDeg || 0) * Math.PI / 180;
  scene.add(pivot);
  pivots.push(pivot);

  const mesh = new THREE.Mesh(geo, mat);
  pivot.add(mesh);          // 自転は mesh.rotation.y（=傾いた自転軸まわり）
  meshes.push(mesh);

  // 太陽グロー
  if(b.emissive){
    const glowMat = new THREE.SpriteMaterial({
      map: makeGlowTexture(b.color), color:0xffffff, transparent:true,
      blending:THREE.AdditiveBlending, depthWrite:false });
    const glow = new THREE.Sprite(glowMat);
    glow.scale.set(r*6, r*6, 1);
    mesh.add(glow);
  }

  // 土星の環: pivot 直下（赤道面）に置く。自転(mesh)の影響を受けず、
  // 自転軸に垂直な赤道面に固定される。
  if(b.rings){
    const ringGeo = new THREE.RingGeometry(r*1.4, r*2.4, 64);
    // UVを半径方向に
    const pos = ringGeo.attributes.position;
    const uv = ringGeo.attributes.uv;
    const v3 = new THREE.Vector3();
    for(let i=0;i<pos.count;i++){
      v3.fromBufferAttribute(pos,i);
      const rr = v3.length();
      uv.setXY(i, (rr - r*1.4)/(r*2.4 - r*1.4), 0.5);
    }
    const ringMat = new THREE.MeshBasicMaterial({
      map: makeRingTexture(b.color), side:THREE.DoubleSide,
      transparent:true, opacity:0.85, depthWrite:false });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI/2; // XY面→XZ面(=pivotの赤道面)に倒す
    pivot.add(ring);
  }

  // トレイル。頂点カラーで「末尾(最新)ほど明るいグラデーション」。位置はリングバッファ
  // で末尾に追加され先頭へ押し出されるので、明るい先端が進み暗い尾が残る＝流れて見える。
  const tgeo = new THREE.BufferGeometry();
  tgeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_MAX*3),3));
  const tcol = new Float32Array(TRAIL_MAX*3);
  const bc = new THREE.Color(b.color);
  for(let k=0;k<TRAIL_MAX;k++){
    const amp = 0.05 + 0.95 * (k/(TRAIL_MAX-1)); // 先頭(古)=暗 … 末尾(新)=明
    tcol[k*3]=bc.r*amp; tcol[k*3+1]=bc.g*amp; tcol[k*3+2]=bc.b*amp;
  }
  tgeo.setAttribute('color', new THREE.BufferAttribute(tcol,3));
  tgeo.setDrawRange(0,0);
  const tmat = new THREE.LineBasicMaterial({ vertexColors:true, transparent:true, opacity:0.85, depthWrite:false });
  const line = new THREE.Line(tgeo, tmat);
  // ジオメトリのバウンディングスフィアは更新されず、銀河公転で座標が大きく動くと
  // フラスタムカリングで消えるため無効化（トレイルは常に表示したい）。
  line.frustumCulled = false;
  trailGroup.add(line);
  // 打点間隔[units]。月は地球周回(半径~0.12units)が小さく既定の TRAIL_SEG(0.3)では
  // 軌跡が数点の多角形に潰れるため、細かい間隔にして滑らかな周回を描く。
  const seg = b.moon ? 0.015 : TRAIL_SEG;
  trails.push({ line, last:null, seg });

  // ラベル（クリックでその天体を中心に）
  const el = document.createElement('div');
  el.textContent = b.name;
  el.style.cssText = 'position:absolute;color:#cde;font-size:11px;cursor:pointer;text-shadow:0 0 3px #000;transform:translate(-50%,-150%);white-space:nowrap;';
  el.addEventListener('click', ()=>focusOn(idx));
  document.body.appendChild(el);
  labelEls.push(el);
});

// ============================================================
// 地表モード（地球の地表から空を見上げる）
// ============================================================
// 地球メッシュの子に「観測者」を置く。観測者はメッシュの自転・傾き・公転位置を
// すべて自動で継承するので、毎フレーム観測者のワールド変換をカメラに写すだけで
// 「自転に追従して星空が流れる地上視点」が得られる。
const earthIndex = BODIES.findIndex(b => b.textureUrl);
// 観測者の置き場。OBS_LAT_DEG/OBS_LON_DEG は「地理座標」(北緯+・東経+)で指定する。
// メッシュのローカル座標への変換は、使用テクスチャが標準的な equirectangular
// (u: 西→東で 0..1=経度-180..+180、v: 上→下で北極..南極) であることと、
// Three.js SphereGeometry の UV→頂点の貼り方から厳密に導ける（実測UVと一致を確認）:
//   テクスチャ左上(0,0)を北極・右下(1,1)を南極とすると、東京(35.7N,139.7E)はUV≈(0.89,0.30)。
//   φ=緯度, λ=経度(rad) として
//     x =  r·cosφ·cosλ
//     y =  r·sinφ          (北緯+ が メッシュ +Y 側。実測: 東京は北緯+35.7で足元一致)
//     z = -r·cosφ·sinλ
//   ※この式は元期での慣性姿勢に対するメッシュのローカル位置。自転は mesh の回転で別途入る。
let OBS_LAT_DEG = 35.7;   // 東京(北緯)
let OBS_LON_DEG = 139.7;  // 東京(東経)
const observer = new THREE.Object3D();
// 目の高さ: 地表ちょうど(係数1.0)だと地面が視線に対し接平面になり下半球が見えない。
// わずかに上(半径の2%)へ上げると地面が下に湾曲して見え、はっきりした地平線になる。
const OBS_EYE = 1.02;
function placeObserver(){
  const r = BODIES[earthIndex].radius * OBS_EYE; // メッシュのローカル半径(pivot.scaleは継承)
  const phi = OBS_LAT_DEG * Math.PI / 180;
  const lam = OBS_LON_DEG * Math.PI / 180;
  const cphi = Math.cos(phi);
  observer.position.set(
     r * cphi * Math.cos(lam),
     r * Math.sin(phi),
    -r * cphi * Math.sin(lam)
  );
}
placeObserver();
meshes[earthIndex].add(observer);
let surfaceMode = false;
// 首振り: 観測者ローカルフレーム基準の方位(yaw)・仰角(pitch)。
//  pitch=+90°で天頂(半径外向き=空)、0°で地平線方向。初期は地平線やや上(地面と空が
//  両方見える)。
let surfYaw = 0, surfPitch = 10 * Math.PI / 180;
let surfFov = 70;            // 地表モードの視野角[deg]（ホイールでズーム）
let prevFovBeforeSurface = camera.fov;
const _obsPos = new THREE.Vector3();
const _surfDir = new THREE.Vector3();

function makeGlowTexture(color){
  const s=128, cv=document.createElement('canvas'); cv.width=s; cv.height=s;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  const c=new THREE.Color(color);
  g.addColorStop(0,`rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},1)`);
  g.addColorStop(0.3,`rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},0.5)`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(cv);
}
function makeRingTexture(color){
  const w=256,h=8, cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d');
  const c=new THREE.Color(color);
  for(let x=0;x<w;x++){
    const a = 0.3 + 0.6*Math.abs(Math.sin(x*0.35)) * (0.5+0.5*Math.random());
    const d=(Math.random()-0.5)*0.2;
    const cc=c.clone(); cc.offsetHSL(0,0,d);
    ctx.fillStyle=`rgba(${cc.r*255|0},${cc.g*255|0},${cc.b*255|0},${a})`;
    ctx.fillRect(x,0,1,h);
  }
  return new THREE.CanvasTexture(cv);
}

// トレイル更新
// ============================================================
function updateTrail(i){
  const t = trails[i];
  const world = toSceneGalaxy(state[i].p);  // ワールド銀河座標(差分判定はこちらで)
  const sp = toTrailLocal(world);           // trailRef 相対(バッファ格納用)
  const arr = t.line.geometry.attributes.position.array;
  if(!t.last){
    // 初回: 全頂点を最初の点で埋める。未使用領域(ゼロ=ワールド原点)が残らないので、
    // 原点へ伸びる暴れた線が出ない。最初は全点同一で1点に潰れ、以降軌跡が伸びる。
    for(let k=0;k<TRAIL_MAX;k++){ arr[k*3]=sp.x; arr[k*3+1]=sp.y; arr[k*3+2]=sp.z; }
    t.last = world.clone();  // last はワールド銀河座標で保持（rebase の影響を受けない）
    t.line.geometry.setDrawRange(0, TRAIL_MAX);
    t.line.geometry.attributes.position.needsUpdate = true;
    return;
  }
  const last3 = (TRAIL_MAX-1)*3;
  // 前回「履歴に確定した」点から t.seg 以上進んだときだけ、新しい点を1つ追加する。
  if(t.last.distanceToSquared(world) >= t.seg*t.seg){
    // 全体を1つ前へずらして末尾(=最新)に新点を置く。色は固定グラデ(末尾=明)なので、
    // 位置だけ流れることで明るい先端が進み暗い尾が残る＝流れて見える。
    arr.copyWithin(0, 3);
    t.last.copy(world);     // 確定点を更新（次の追加判定の基準）
  }
  // 末尾(最新)点は毎回 現在位置へスナップする。これをしないと、付け根が最大 TRAIL_SEG
  // 後方に取り残され、実スケールで天体に寄ると「惑星(極小)とトレイル付け根のズレ」が
  // 毎フレーム揺れてチカチカする。末尾だけ常に惑星へ固定すれば付け根が一致して安定する。
  arr[last3]=sp.x; arr[last3+1]=sp.y; arr[last3+2]=sp.z;
  t.line.geometry.attributes.position.needsUpdate = true;
}

// トレイル基準原点を newRef へ移し替える。格納済み頂点は全て (旧基準相対)→(新基準相対)
// へ平行移動する（見た目は不変、float32 精度だけが基準近傍で改善）。
// rebase は全頂点(約 TRAIL_MAX×天体数)の書き換え=やや重いので、基準から tol 以上
// 離れたときだけ行う。tol 以内なら float32 精度は ~tol×2^-23 で保たれる。
//   - フォーカス中  : tol≈0（天体にぴったり追従。実スケールで寄っても稲妻が出ない）
//   - フォーカスなし : tol 大きめ（数百 units のズレは全体表示では無視でき、高速早送りで
//                      galaxyDisp が膨らんでも全頂点書き換えの頻発を防ぐ）
const _refDelta = new THREE.Vector3();
function rebaseTrails(newRef, tol = 0){
  _refDelta.subVectors(trailRef, newRef);  // 旧 − 新 = 各頂点に足す量
  if(_refDelta.lengthSq() <= tol*tol) return;
  const dx=_refDelta.x, dy=_refDelta.y, dz=_refDelta.z;
  for(const t of trails){
    if(!t.last) continue;
    const arr = t.line.geometry.attributes.position.array;
    for(let k=0;k<arr.length;k+=3){ arr[k]+=dx; arr[k+1]+=dy; arr[k+2]+=dz; }
    t.line.geometry.attributes.position.needsUpdate = true;
  }
  trailRef.copy(newRef);
}

  const d = new Date(EPOCH.getTime() + simSeconds*1000 + 9*3600*1000);

}

// 1秒あたりに進むシミュレーション時間を読みやすい単位で表す
function fmtDuration(years){
  const sec = years * YEAR;
  if(years >= 1)      return `${years.toFixed(2)} 年`;
  if(sec/DAY >= 1)    return `${(sec/DAY).toFixed(2)} 日`;
  if(sec/3600 >= 1)   return `${(sec/3600).toFixed(2)} 時間`;
  if(sec/60 >= 1)     return `${(sec/60).toFixed(2)} 分`;
  return `${sec.toFixed(2)} 秒`;
}
function applySpeed(){
  yearsPerSecond = Math.pow(10, parseFloat(speedSlider.value));
  const ratio = yearsPerSecond * YEAR; // 実時間に対する倍速（1で等倍）
  const ratioStr = ratio < 10 ? ratio.toFixed(ratio < 1.5 ? 2 : 1) : Math.round(ratio).toLocaleString();
  speedVal.textContent = `1秒 = ${fmtDuration(yearsPerSecond)}（実時間の ${ratioStr} 倍速）`;
}
speedSlider.addEventListener('input', applySpeed);
applySpeed();

// ----- 惑星直列（このシミュレーション内で実際に集まる瞬間を計算で探す） -----
// 簡易積分のため固定日付（実暦の2161年など）では誤差で直列にならない。そこで
// 「全惑星の黄経がある弧の中に収まる」最初の瞬間をシミュレーションを先送りして探す。
// この弧以内に全惑星が収まれば直列とみなす。実際の「フル直列」でも8惑星は約69°に
// 集まる程度（最小spreadは約62°/≈160年後）。やや緩めの90°で「ゆるい直列」を拾う。
const ALIGN_THRESHOLD = 90 * Math.PI / 180;

// 全惑星(太陽・月・摂動天体を除く)の黄経が収まる最小弧[rad]。小さいほど直列。
// 黄経は太陽中心（地球から見た直列の感覚に合わせる）。state は SSB 基準なので
// 太陽位置を引いてから atan2 する。摂動天体(冥王星・小惑星)は判定に入れない。
function alignmentSpread(){
  const sun = state[0].p;
  const ang = [];
  for(let i=1;i<N_VISIBLE;i++){
    if(BODIES[i].moon) continue; // 月は惑星ではないので直列判定から除外
    ang.push(Math.atan2(state[i].p.y - sun.y, state[i].p.x - sun.x));
  }
  ang.sort((a,b)=>a-b);
  let maxGap = (ang[0] + 2*Math.PI) - ang[ang.length-1]; // wrap ギャップ
  for(let i=1;i<ang.length;i++) maxGap = Math.max(maxGap, ang[i]-ang[i-1]);
  return 2*Math.PI - maxGap; // 収まる弧
}
// グローバル state / simSeconds の保存・復元
function snapshotState(){
  return {
    t: simSeconds,
    p: state.map(s=>s.p.clone()),
    v: state.map(s=>s.v.clone()),
    a: state.map(s=>s.a.clone()),
  };
}
function restoreState(snap){
  simSeconds = snap.t;
  for(let i=0;i<state.length;i++){
    state[i].p.copy(snap.p[i]); state[i].v.copy(snap.v[i]); state[i].a.copy(snap.a[i]);
  }
}
// 現在以降で直列になる最初の simSeconds を探す（見つからなければ null）。
function findNextAlignment(){
  const snap = snapshotState();
  // スキャン幅。基本0.2日だが、太陽質量/重力を上げると公転が速くなる(周期∝1/√GM)ため
  // それに合わせて細かくしないと極小を取り逃して誤検出する。倍率に応じて縮める。
  const SCAN_DT = 0.2 * DAY / Math.sqrt(Math.max(0.05, gMul * sunMassMul));
  const MAX_YEARS = 300;             // 探索上限（直列は数百年以内に必ず現れる）
  const maxSteps = Math.ceil(MAX_YEARS * YEAR / SCAN_DT);
  let found = null;
  let wasAligned = alignmentSpread() <= ALIGN_THRESHOLD; // 開始時すでに直列なら一旦抜けるまで待つ
  let inEvent = false, bestSpread = Infinity, bestT = 0;
  for(let k=0;k<maxSteps;k++){
    stepPhysics(SCAN_DT);
    const sp = alignmentSpread();
    const aligned = sp <= ALIGN_THRESHOLD;
    if(aligned && !wasAligned) inEvent = true; // 集まりイベント開始
    if(inEvent){
      // イベント中は最も集まった瞬間(spread極小)を記録し続ける
      if(sp < bestSpread){ bestSpread = sp; bestT = simSeconds; }
      if(!aligned){ found = bestT; break; } // 閾値を抜けたら極小点で確定
    }
    wasAligned = aligned;
  }
  restoreState(snap);
  return found;
}

const alignBtn = document.getElementById('alignBtn');
alignBtn.addEventListener('click', ()=>{
  alignBtn.disabled = true;
  alignBtn.textContent = '🪐 探索中…';
  // 探索は同期処理なので、UI更新を挟んでから実行
  setTimeout(()=>{
    const targetT = findNextAlignment();
    alignBtn.disabled = false;
    if(targetT == null){ alignTempLabel('🪐 直列が見つかりません'); return; }
    startCatchup(()=>targetT, ()=>{
      running = false; pauseBtn.textContent = '▶ 再生'; // 直列の瞬間で一時停止
      const d = new Date(EPOCH.getTime() + targetT*1000);
      const deg = Math.round(alignmentSpread() * 180 / Math.PI);
      // 到達時に実際の集まり角度を再確認。閾値を明確に超えていたら、探索時と
      // 配置がズレた(物理倍率を極端にいじった等)とみなし、失敗として知らせる。
      if(deg > 100){
        alignTempLabel(`🪐 直列を捉えられず（${deg}°）`);
      } else {
        alignBtn.textContent = `🪐 直列 ${d.getUTCFullYear()}年`
          + `${String(d.getUTCMonth()+1).padStart(2,'0')}月${String(d.getUTCDate()).padStart(2,'0')}日`
          + `（${deg}°）`;
      }
    });
  }, 30);
});

  // 銀河公転の累積変位もリセット（モード切替時にトレイルが混線しないように）

  galaxyDisp.set(0,0,0);
  trailRef.set(0,0,0);
  trailGroup.position.set(0,0,0);
}

function applyGalaxyMode(on){
  galaxyMode = on;
  // 座標系が変わるので既存トレイルはクリア（混線防止）
  clearTrails();
}
document.getElementById('galaxy').addEventListener('change', e=>applyGalaxyMode(e.target.checked));

// 実スケール表示: pivot.scale を切り替えて本体・環を実際の半径比で描く。
// 実半径は距離スケールに対し極小なので、ほぼ点になる（注記で明示）。
function applyRealSize(on){
  realSize = on;
  document.getElementById('realSizeNote').style.display = on ? 'block' : 'none';
  for(let i=0;i<pivots.length;i++){
    let factor = 1;
    if(on && BODIES[i].realRadiusKm){
      const realUnits = BODIES[i].realRadiusKm*1000 / AU * SCALE;
      factor = realUnits / BODIES[i].radius;
    }
    pivots[i].scale.setScalar(factor);
    // 月は誇張表示だと地球周回半径(~0.12units)に対し大きすぎて地球にめり込むため、
    // 実スケール表示のときだけ見せる（本体・ラベル・トレイル・凡例）。物理計算は常に有効。
    if(BODIES[i].moon){
      pivots[i].visible = on;
      labelEls[i].style.display = on ? '' : 'none';
      trails[i].line.visible = on && showTrails;
      legendSpans[i].style.display = on ? '' : 'none';
    }
  }
  // サイズが変わったのでズームを調整: フォーカス中はその天体に合った距離へ、
  // フォーカスなしは既定ビューへ戻す（実⇔誇張の切替で拡大しすぎが残らない）。
  if(focusIndex != null) setFocus(focusIndex);
  else resetView();
}
document.getElementById('realSize').addEventListener('change', e=>applyRealSize(e.target.checked));

// ============================================================
// 面白機能: 彗星（test particle）
// ============================================================
const COMET_MAX = 8;           // 同時に存在できる彗星の最大数
const cometTailMat = new THREE.LineBasicMaterial({ color:0x9fdcff, transparent:true, opacity:0.6 });

function spawnComet(){
  if(comets.length >= COMET_MAX) return; // 上限に達していたら何もしない
  // それっぽいランダムな高離心率軌道（実在のものではない）。
  const rApo = (30 + Math.random()*30) * AU;        // 遠日点 30〜60 AU から発射
  const q    = (0.1 + Math.random()*1.9) * AU;      // 近日点 0.1〜2 AU
  const a    = (q + rApo) / 2;                       // 軌道長半径
  // 発射方向（黄道面に近いランダム方向、少しだけ面外に傾ける）
  const th = Math.random()*Math.PI*2;
  const zTilt = (Math.random()-0.5)*0.5;            // 面外成分（小さめ）
  const dir = new THREE.Vector3(Math.cos(th), Math.sin(th), zTilt).normalize();
  const pos = dir.clone().multiplyScalar(rApo);
  // 遠日点での速度（vis-viva）。方向は黄道面内で位置に垂直な接線。
  const GM = BODIES[0].gm * gMul * sunMassMul;
  const vMag = Math.sqrt(Math.max(0, GM * (2/rApo - 1/a)));
  const up = new THREE.Vector3(0,0,1);
  let tangent = new THREE.Vector3().crossVectors(up, dir);
  if(tangent.lengthSq() < 1e-6) tangent.set(1,0,0);
  tangent.normalize();
  if(Math.random()<0.5) tangent.negate();           // 公転の向きをランダムに
  const vel = tangent.multiplyScalar(vMag);

  // 見た目: 核（小さな白い球）＋太陽と反対へ伸びる尾
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(1.2, 12, 8),
    new THREE.MeshBasicMaterial({ color:0xddf6ff })
  );
  core.frustumCulled = false;
  scene.add(core);
  const TAIL_N = 24;
  const tgeo = new THREE.BufferGeometry();
  tgeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TAIL_N*3), 3));
  const tail = new THREE.Line(tgeo, cometTailMat);
  tail.frustumCulled = false;
  scene.add(tail);

  comets.push({ p:pos, v:vel, a:new THREE.Vector3(), core, tail, tailN:TAIL_N });
}

// 彗星の描画更新（物理積分は stepPhysics 側で実施済み）。彗星は束縛軌道で
// 周回し続けるため削除はしない（上限 COMET_MAX で発射を止める方式）。
const _sunScene = new THREE.Vector3();
function updateComets(){
  if(comets.length === 0) return;
  _sunScene.copy(toScene(state[0].p)); // 太陽のシーン位置
  for(const c of comets){
    const sp = toScene(c.p);
    c.core.position.copy(sp);
    // 尾: 太陽と反対方向へ、太陽に近いほど長く伸ばす
    const awaySun = sp.clone().sub(_sunScene);
    const sunDistAU = c.p.length()/AU;
    const tailLen = Math.max(8, 90 / Math.max(0.3, sunDistAU)); // 近いほど長い
    awaySun.normalize();
    const arr = c.tail.geometry.attributes.position.array;
    for(let i=0;i<c.tailN;i++){
      const t = i/(c.tailN-1);
      arr[i*3]   = sp.x + awaySun.x*tailLen*t;
      arr[i*3+1] = sp.y + awaySun.y*tailLen*t;
      arr[i*3+2] = sp.z + awaySun.z*tailLen*t;
    }
    c.tail.geometry.attributes.position.needsUpdate = true;
  }
}

// 全彗星を削除（リセット時など）
function clearComets(){
  for(const c of comets){
    scene.remove(c.core); scene.remove(c.tail);
    c.core.geometry.dispose(); c.tail.geometry.dispose();
  }
  comets.length = 0;
}

document.getElementById('cometBtn').addEventListener('click', spawnComet);

// ランダム飛来オプション。シミュレーション時間で平均約3年に1個のペース。
let autoComet = false;
const COMET_MEAN_INTERVAL = 3 * YEAR; // 平均発射間隔（シミュレーション秒）
const autoCometCb = document.getElementById('autoComet');
autoComet = autoCometCb.checked; // リロードで復元された状態に同期
autoCometCb.addEventListener('change', e=>{ autoComet = e.target.checked; });
// このフレームで進んだシミュレーション秒に応じて確率的に発射する。
function maybeSpawnComets(simAdvanceSec){
  if(!autoComet || simAdvanceSec <= 0) return;
  let expected = simAdvanceSec / COMET_MEAN_INTERVAL; // 期待発射数
  // 整数部は確定発射、端数は確率発射（高速再生でもペースが保たれる）
  let n = Math.floor(expected) + (Math.random() < (expected % 1) ? 1 : 0);
  n = Math.min(n, 20); // 暴走防止
  for(let i=0;i<n;i++) spawnComet();
}

// 天体フォーカス。フォーカス中はカメラ系を天体の移動ぶん平行移動して追従する
// （距離・角度=ズーム率が保たれる）。focusPrev は差分計算用の前フレーム天体位置。
const focusPrev = new THREE.Vector3();
const _camDir = new THREE.Vector3();

// その天体が画面に程よく収まるカメラ距離。実際の描画半径(表示半径×scale)に比例。
function focusDistance(i){
  const effR = BODIES[i].radius * pivots[i].scale.x; // 実スケール時は縮小済み
  return Math.max(effR * 6, 0.003); // 下限(near より十分大きく)
}
// 注視点をその天体へ移し、サイズに合った距離・現在の視線方向でカメラを置く。
function setFocus(i){
  focusIndex = i;
  const pos = pivots[i].position;
  // 現在の視線方向を維持（初回は既定方向にフォールバック）
  _camDir.subVectors(camera.position, controls.target);
  if(_camDir.lengthSq() < 1e-9) _camDir.set(0, 0.5, 1);
  _camDir.normalize();
  controls.target.copy(pos);
  camera.position.copy(pos).addScaledVector(_camDir, focusDistance(i));
  focusPrev.copy(pos);
  // 一時停止中でも即座に高精度になるよう、トレイル基準をこの天体へ寄せておく
  // （通常はメインループが毎フレーム rebase する）。
  if(showTrails) rebaseTrails(toSceneGalaxy(state[i].p));
}
// 既定ビュー（フォーカス解除時）
function resetView(){
  controls.target.set(0,0,0);
  camera.position.set(0,120,240);
  // 全体表示の基準は galaxyOffset()（銀河モードoffならゼロ）。メインループと同じ基準に
  // 揃えておくと、一時停止中の解除でも不要な再 rebase が起きない。
  if(showTrails) rebaseTrails(galaxyOffset(), 200);
}
// クリック時: 同じ天体なら解除して既定ビュー、別の天体ならその天体にフォーカス。
function focusOn(i){
  if(surfaceMode) return;       // 地表モード中はラベル/凡例クリックを無視
  if(focusIndex === i){ focusIndex = null; resetView(); return; }
  setFocus(i);
}

// 地表モードの開始/終了。
let realSizeBeforeSurface = false; // 地表モードに入る前の実スケール設定（退出時に復元）
function setSurfaceMode(on){
  surfaceMode = on;
  document.getElementById('surfaceNote').style.display = on ? 'block' : 'none';
  const realCb = document.getElementById('realSize');
  if(on){
    focusIndex = null;          // 通常フォーカスは解除
    controls.enabled = false;   // OrbitControls を止め、カメラを直接制御
    // 地表からの見え方は実スケールが正しい（誇張サイズだと近傍の天体が巨大に映る）。
    // 退出時に戻せるよう現在の設定を覚え、実スケールへ切り替える。
    realSizeBeforeSurface = realCb.checked;
    realCb.checked = true;
    applyRealSize(true);
    prevFovBeforeSurface = camera.fov;
    camera.fov = surfFov;
    // 実スケールの地球は半径~0.002 units と極小。足元の地面は near=0.001 より近く、
    // そのままだと地面がクリップされて見えない。地表モード中だけ near を大幅に縮める。
    camera.near = 1e-6;
    camera.updateProjectionMatrix();
  } else {
    controls.enabled = true;
    camera.fov = prevFovBeforeSurface;
    camera.near = 0.001;        // 通常の near へ戻す
    camera.updateProjectionMatrix();
    // 実スケール設定を地表モード前の状態へ戻す。
    realCb.checked = realSizeBeforeSurface;
    applyRealSize(realSizeBeforeSurface);
    resetView();                // 全体ビューへ戻す
  }
  const cb = document.getElementById('surface');
  if(cb.checked !== on) cb.checked = on;
}
document.getElementById('surface').addEventListener('change', e=> setSurfaceMode(e.target.checked));

// 地表モードの首振り（ドラッグ）とズーム（ホイール）。OrbitController と競合しない
// よう、surfaceMode のときだけ作用する。ドラッグで yaw/pitch を更新。
{
  let dragging = false, lastX = 0, lastY = 0;
  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', e=>{
    if(!surfaceMode) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e=>{
    if(!surfaceMode || !dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    // 画面に対し自然な向き: 右ドラッグで右を向く＝yaw減、上ドラッグで上を向く＝pitch増。
    const k = 0.0025 * (surfFov / 70); // 視野が狭いほど感度を下げる
    surfYaw   -= dx * k;
    surfPitch += dy * k;
    const lim = Math.PI/2 - 0.01;
    surfPitch = Math.max(-lim, Math.min(lim, surfPitch));
  });
  const endDrag = ()=>{ dragging = false; };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('wheel', e=>{
    if(!surfaceMode) return;
    e.preventDefault();
    surfFov = Math.max(20, Math.min(110, surfFov + Math.sign(e.deltaY) * 4));
    camera.fov = surfFov;
    camera.updateProjectionMatrix();
  }, { passive:false });
}

// 地表モードのカメラを毎フレーム更新。観測者(地球メッシュの子)のワールド位置に
// カメラを置き、半径外向きを「上(天頂)」とする局所フレームで yaw/pitch だけ向ける。
const _planetCenter = new THREE.Vector3();
const _up = new THREE.Vector3();
const _north = new THREE.Vector3();
const _east = new THREE.Vector3();
const _northT = new THREE.Vector3();
const _look = new THREE.Vector3();
const _meshQuat = new THREE.Quaternion();
function updateSurfaceCamera(){
  // 観測者のワールド変換を確定（このフレームの自転・公転位置を反映）。
  observer.updateWorldMatrix(true, false);
  _obsPos.setFromMatrixPosition(observer.matrixWorld);
  _planetCenter.copy(pivots[earthIndex].position);
  // 天頂方向 = 惑星中心→観測者（半径外向き）。
  _up.subVectors(_obsPos, _planetCenter).normalize();
  // 自転に追従する接線基準: 惑星の北極(メッシュのローカル+Y)をワールドへ。
  meshes[earthIndex].getWorldQuaternion(_meshQuat);
  _north.set(0,1,0).applyQuaternion(_meshQuat);
  // 接線平面に正射影した東西・南北の基底（自転とともに回る）。
  _east.crossVectors(_north, _up);
  if(_east.lengthSq() < 1e-9) _east.set(1,0,0); // 極の特異点回避
  _east.normalize();
  _northT.crossVectors(_up, _east).normalize();
  // yaw: 接線平面内の方位、pitch: 天頂へ向かう仰角。
  const cp = Math.cos(surfPitch), sp = Math.sin(surfPitch);
  _look.set(0,0,0)
    .addScaledVector(_northT, cp * Math.cos(surfYaw))
    .addScaledVector(_east,   cp * Math.sin(surfYaw))
    .addScaledVector(_up,     sp)
    .normalize();
  camera.position.copy(_obsPos);
  camera.up.copy(_up);
  _surfDir.copy(_obsPos).add(_look);
  camera.lookAt(_surfDir);
}

// ============================================================
// メインループ
// ============================================================
let lastTime = performance.now();
const _v = new THREE.Vector3();
const _focusDelta = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  let realDt = (now - lastTime)/1000;
  lastTime = now;
  if(realDt > 0.1) realDt = 0.1; // タブ復帰時の暴走防止

  if(running){
    // このフレームで進めるべきシミュレーション秒数
    let simAdvance;
    if(catchup){
      // 目標simSecondsまで高速で詰める（過去ならマイナス方向に逆回し）。
      // 残りに比例した速度で ease-out 的に進め、到達したら onArrive を呼ぶ。
      const remaining = catchup.target() - simSeconds; // 秒（符号付き: 負=過去）
      const absRem = Math.abs(remaining);
      if(absRem <= 0){
        simAdvance = 0; const cb = catchup.onArrive; catchup = null; cb && cb();
      } else {
        const dir = Math.sign(remaining);
        const yps = Math.min(Math.max((absRem/YEAR) / 4, 2), 500); // 約4秒で到達、上下限あり
        simAdvance = dir * Math.min(realDt * yps * YEAR, absRem);
        if(Math.abs(simAdvance) >= absRem){ const cb = catchup.onArrive; catchup = null; cb && cb(); }
      }
    } else {
      simAdvance = realDt * yearsPerSecond * YEAR;
    }
    // PHYS_DT(0.05日)は1ステップの上限。遅いときは可変dtで滑らかに（等倍まで対応）、
    // 速いときは PHYS_DT 刻みに分割しつつ1フレーム最大10000ステップでクランプ。
    // simAdvance が負（逆回し）のときは dt も負になる（Yoshida は時間対称なので可）。
    let steps, dt;
    const absAdv = Math.abs(simAdvance);
    if(absAdv === 0){
      steps = 0; dt = 0;
    } else if(absAdv <= PHYS_DT){
      steps = 1; dt = simAdvance;
    } else {
      steps = Math.min(Math.ceil(absAdv / PHYS_DT), 10000);
      dt = simAdvance / steps;
    }
    // このフレームでトレイル点を打つ回数。等倍付近では「4サブステップに1回」を保つが、
    // 高速早送り時はサブステップ数が膨大になり、毎回 updateTrail(全頂点コピー)を呼ぶと
    // 重く、かつ点間隔も TRAIL_SEG で頭打ちになり見た目に寄与しない。そこで1フレーム
    // あたりの打点回数を TRAIL_PLOTS_MAX で頭打ちにし、ステップ全体へ等間隔に配る。
    let plotsThisFrame = 0;
    if(showTrails && steps > 0){
      plotsThisFrame = Math.min(Math.ceil(steps / 4), TRAIL_PLOTS_MAX);
      // 点を打つ直前にトレイル基準原点をこのフレームの基準へ寄せる(フレーム1回)。
      // 基準は「格納頂点を原点付近(小さい値)に保つ」ためのもの:
      //  - フォーカス中  : その天体の近傍 → 実スケールで寄っても float32 が天体半径より
      //                     細かく、稲妻状のギザギザが出ない(tol=0で厳密追従)。
      //  - フォーカスなし: galaxyOffset() に追従 → 銀河 galaxyDisp が数百万 units まで
      //                     膨らんでも格納値 ≈ 原点付近に保たれ、階段状のカクつきが出ない。
      //                     フレーム内の galaxyDisp の振れ幅(高速でも ~数万 units)では
      //                     精度 ~数e-3 units で TRAIL_SEG(0.3)に対し十分なので毎フレ1回でよい。
      if(focusIndex != null) rebaseTrails(toSceneGalaxy(state[focusIndex].p));
      else rebaseTrails(galaxyOffset(), 200);
    }
    // plotsThisFrame 個の打点を steps 個のサブステップへ等間隔に割り当てる。
    // j 番目(1..plotsThisFrame)の打点を k = round(j*steps/plotsThisFrame)-1 で行い、
    // 最後の打点が必ず k=steps-1(=最新)に来るようにする。
    let plotsDone = 0;
    for(let k=0;k<steps;k++){
      stepPhysics(dt);
      // 銀河公転変位を積算。updateTrail は galaxyOffset を参照するので先に進める。
      advanceGalaxy(dt / YEAR);
      // 残り打点数に対し、このサブステップが割り当て境界に達したら打つ。
      if(plotsDone < plotsThisFrame &&
         (k+1) >= Math.round((plotsDone+1) * steps / plotsThisFrame)){
        plotsDone++;
        // 通常は太陽(i=0)を除外（原点に溜まるだけ）。銀河公転モードでは太陽系全体が
        // 動くので太陽の軌跡も描く。
        for(let i = galaxyMode ? 0 : 1; i<N_VISIBLE; i++) updateTrail(i);
      }
    }
    maybeSpawnComets(simAdvance); // ランダム飛来（順方向のみ）
  }

  // メッシュ位置更新 + 自転（太陽系原点系: 銀河変位を加えず原点付近に保つ）
  // 自転はシミュレーション経過時間と実自転周期に連動（速度を遅めると自転も遅くなる）。
  // 角度は 0〜2π に剰余を取り、大きな simSeconds でも精度を保つ。
  for(let i=0;i<N_VISIBLE;i++){
    pivots[i].position.copy(toScene(state[i].p)); // 位置は pivot に（mesh は pivot 中心）
    // 自転角: 恒星日に基づく。負の rotHours は逆行。剰余で 0〜2π に収め精度を保つ。
    const turns = simSeconds / (BODIES[i].rotHours * 3600);
    const spin = (turns - Math.floor(turns)) * 2 * Math.PI;
    if(BODIES[i].textureUrl){
      // 地球（実テクスチャ）: 慣性空間で固定した自転軸 EARTH_AXIS のまわりを自転させる。
      // 軸が公転位置によらず一定なので、季節（夏至に北極が太陽側＝白夜 など）と
      // ターミネーターの傾きが再現される。位相 EARTH_PHASE0 で昼夜を日時に同期。
      // 姿勢 = ローカルy(テクスチャの北極)を EARTH_AXIS に向ける × y軸まわりに自転。
      _earthTiltQuat.setFromUnitVectors(_yAxis, EARTH_AXIS);
      _earthSpinQuat.setFromAxisAngle(_yAxis, spin + EARTH_PHASE0);
      meshes[i].quaternion.copy(_earthTiltQuat).multiply(_earthSpinQuat);
    } else {
      meshes[i].rotation.y = spin;
    }
  }
  // 太陽光源を太陽位置へ
  sunLight.position.copy(pivots[0].position);

  // トレイルグループを太陽系基準へ平行移動。トレイル点は (ワールド銀河座標 − trailRef)
  // で蓄積されるので、描画位置 = 格納値 + trailGroup.position。最新点を惑星に一致させ
  // (= ワールド銀河座標 − galaxyDisp) るには trailGroup.position = trailRef − galaxyDisp。
  // この恒等式は trailRef の値によらず成立する（だから rebase は見た目を変えない）。
  // 銀河モードoff & フォーカスなしでは trailRef=galaxyDisp=0 → trailGroup.position=0。
  const off = galaxyOffset();
  trailGroup.position.set(trailRef.x - off.x, trailRef.y - off.y, trailRef.z - off.z);

  updateComets();

  if(surfaceMode){
    updateSurfaceCamera();
  } else {
    // 天体フォーカス: 天体の移動ぶんカメラ系(注視点+カメラ位置)を平行移動して追従。
    // 距離・角度(ズーム率)は保たれ、ユーザーの回転・ズーム操作もそのまま効く。
    if(focusIndex != null){
      const pos = pivots[focusIndex].position;
      _focusDelta.subVectors(pos, focusPrev);
      controls.target.add(_focusDelta);
      camera.position.add(_focusDelta);
      focusPrev.copy(pos);
    }
    controls.update();
  }
  renderer.render(scene, camera);
  updateDate();

  // ラベル位置をスクリーン座標へ投影（pivot=天体のワールド位置）。
  // カメラから遠い天体ほど薄くして、引いたとき/奥の天体のラベルの重なりを軽減。
  // 「天体名を表示」オフのときは投影計算ごとスキップ（隠すのは change ハンドラで実施済み）。
  if(showLabels) for(let i=0;i<N_VISIBLE;i++){
    // 月は実スケール表示のときだけ見せる（誇張表示では本体ごと非表示）
    if(BODIES[i].moon && !realSize){ labelEls[i].style.display='none'; continue; }
    _v.copy(pivots[i].position).project(camera);
    if(_v.z > 1 || _v.z < -1){ labelEls[i].style.display='none'; continue; }
    const x = (_v.x*0.5+0.5)*window.innerWidth;
    const y = (-_v.y*0.5+0.5)*window.innerHeight;
    const dist = pivots[i].position.distanceTo(camera.position);
    const op = Math.max(0.25, Math.min(1, 1 - (dist - 400) / 3000)); // 近=1, 遠=0.25
    labelEls[i].style.display='block';
    labelEls[i].style.left = x+'px';
    labelEls[i].style.top = y+'px';
    labelEls[i].style.opacity = op.toFixed(2);
  }
}
animate();
</script>
</body>
</html>
